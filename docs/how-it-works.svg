<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="t">
<title id="t">Describe your interests, browse normally, see what holds your attention</title>
<rect width="1400" height="400" rx="20" fill="#f3f6f1"/>
<g font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <g transform="translate(48 48)">
    <rect width="410" height="304" rx="16" fill="#fff" stroke="#1f3a31" stroke-width="2.5"/>
    <text x="32" y="58" font-family="ui-monospace,Menlo,monospace" font-size="16" letter-spacing="3" fill="#2e8b57">01 · DESCRIBE</text>
    <text x="32" y="104" font-size="26" font-weight="700" fill="#16302a">Your interests,</text>
    <text x="32" y="136" font-size="26" font-weight="700" fill="#16302a">in your own words</text>
    <rect x="32" y="166" width="346" height="40" rx="8" fill="#f1f4f9"/><text x="48" y="192" font-size="15" fill="#344054">Artificial Intelligence</text>
    <rect x="32" y="216" width="346" height="54" rx="8" fill="#f1f4f9"/><text x="48" y="240" font-size="13.5" fill="#667085">"practical uses of AI agents, with</text><text x="48" y="259" font-size="13.5" fill="#667085">real examples and results"</text>
  </g>
  <g transform="translate(495 48)">
    <rect width="410" height="304" rx="16" fill="#fff" stroke="#1f3a31" stroke-width="2.5"/>
    <text x="32" y="58" font-family="ui-monospace,Menlo,monospace" font-size="16" letter-spacing="3" fill="#2e8b57">02 · BROWSE</text>
    <text x="32" y="104" font-size="26" font-weight="700" fill="#16302a">Scroll as usual.</text>
    <text x="32" y="136" font-size="26" font-weight="700" fill="#16302a">Expand what you like.</text>
    <g fill="#e4e7ec"><rect x="32" y="166" width="230" height="10" rx="5"/><rect x="32" y="186" width="300" height="10" rx="5"/><rect x="32" y="226" width="260" height="10" rx="5"/><rect x="32" y="246" width="190" height="10" rx="5"/></g>
    <rect x="276" y="236" width="102" height="30" rx="15" fill="#e7f5ec" stroke="#2e8b57" stroke-width="2"/><text x="327" y="256" font-size="13.5" font-weight="600" fill="#2e8b57" text-anchor="middle">…see more</text>
    <text x="32" y="290" font-size="13.5" fill="#667085">Each visible post counts once a day.</text>
  </g>
  <g transform="translate(942 48)">
    <rect width="410" height="304" rx="16" fill="#16302a"/>
    <text x="32" y="58" font-family="ui-monospace,Menlo,monospace" font-size="16" letter-spacing="3" fill="#9fd8b7">03 · UNDERSTAND</text>
    <text x="32" y="104" font-size="26" font-weight="700" fill="#fff">See what really</text>
    <text x="32" y="136" font-size="26" font-weight="700" fill="#fff">holds your attention</text>
    <text x="32" y="186" font-size="15" fill="#cdebd8">In Focus</text><text x="378" y="186" font-size="15" font-weight="700" fill="#fff" text-anchor="end">3 / 7</text>
    <rect x="32" y="196" width="346" height="8" rx="4" fill="#2f5a4b"/><rect x="32" y="196" width="148" height="8" rx="4" fill="#45b07a"/>
    <text x="32" y="236" font-size="15" fill="#f4d5d3">Off Topic</text><text x="378" y="236" font-size="15" font-weight="700" fill="#fff" text-anchor="end">4 / 17</text>
    <rect x="32" y="246" width="346" height="8" rx="4" fill="#5a3b3b"/><rect x="32" y="246" width="81" height="8" rx="4" fill="#e06a6a"/>
    <text x="32" y="286" font-size="13.5" fill="#9fb8ad">Expanded / Total, by interest and by month</text>
  </g>
</g>
</svg>
